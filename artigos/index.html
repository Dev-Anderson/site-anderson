<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore todos os artigos de Anderson Silva sobre gestão de produtos, tecnologia, engenharia de APIs e métricas ágeis.">
    <title>Todos os Artigos | Anderson Silva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 selection:bg-blue-500 selection:text-white">
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/80">
        <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
            <a href="../index.html#blog" class="flex items-center gap-3 text-sm font-semibold text-slate-700 transition-colors hover:text-blue-600 dark:text-slate-200 dark:hover:text-blue-400">
                <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-lg font-bold text-white">AS</span>
                <span>Anderson Silva <span class="font-normal text-slate-400">/ Publicações</span></span>
            </a>
            <button id="theme-toggle" type="button" aria-label="Alternar tema" class="rounded-lg p-2 text-slate-600 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"><i id="theme-icon" class="fas fa-sun text-amber-400"></i></button>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
        <div class="mb-8 flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
            <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400">Publicações &amp; Insights</span>
                <h1 id="page-title" class="mt-1 scroll-mt-24 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Todos os artigos</h1>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Ideias e aprendizados sobre produtos, tecnologia e liderança.</p>
            </div>
            <label class="relative block w-full md:max-w-xs">
                <span class="sr-only">Buscar artigos</span>
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400"></i>
                <input id="article-search" type="search" placeholder="Buscar artigos..." class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" />
            </label>
        </div>

        <div id="category-filters" class="mb-6 flex flex-wrap gap-2" aria-label="Filtrar artigos por categoria">
            <button type="button" data-filter="all" aria-pressed="true" class="category-filter rounded-lg bg-blue-600 px-3 py-2 text-xs font-semibold text-white transition">Todos</button>
            <button type="button" data-filter="produto" aria-pressed="false" class="category-filter rounded-lg bg-slate-200 px-3 py-2 text-xs font-medium text-slate-700 transition hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">Gestão de Produto</button>
            <button type="button" data-filter="tecnologia" aria-pressed="false" class="category-filter rounded-lg bg-slate-200 px-3 py-2 text-xs font-medium text-slate-700 transition hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">Engenharia &amp; APIs</button>
            <button type="button" data-filter="agil" aria-pressed="false" class="category-filter rounded-lg bg-slate-200 px-3 py-2 text-xs font-medium text-slate-700 transition hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">Métricas &amp; Ágil</button>
        </div>

        <p id="results-summary" class="mb-4 text-xs text-slate-500 dark:text-slate-400" aria-live="polite"></p>
        <div id="articles-grid" class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
        <div id="empty-state" class="hidden rounded-2xl border border-dashed border-slate-300 px-6 py-12 text-center dark:border-slate-700">
            <i class="fas fa-magnifying-glass mb-3 text-2xl text-slate-400"></i>
            <p class="font-semibold text-slate-800 dark:text-white">Nenhum artigo encontrado</p>
            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Tente outro termo ou selecione uma categoria diferente.</p>
        </div>

        <nav id="pagination" class="mt-10 flex flex-wrap items-center justify-center gap-2" aria-label="Paginação dos artigos"></nav>
        <a href="../index.html#blog" class="mt-10 inline-flex items-center gap-2 text-sm font-medium text-blue-600 transition hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300"><i class="fas fa-arrow-left text-xs"></i> Voltar ao site</a>
    </main>

    <footer class="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">© 2026 Anderson Silva. Cascavel, PR.</footer>

    <script>
        // Novo post: duplique TEMPLATE-artigo.html, crie o HTML nesta pasta e registre seus metadados neste array.
        const articles = [
            {
                title: 'Como Aumentar a Entregabilidade de Sprints de 35% para 65%',
                description: 'Estratégias práticas de controle de escopo, alinhamento rigoroso de critérios de aceite e ritos de visibilidade para times de tecnologia.',
                category: 'Gestão de Produto',
                filters: ['produto', 'agil'],
                date: '14 Out, 2026',
                dateValue: '2026-10-14',
                readingTime: '5 min de leitura',
                href: 'artigo-entregabilidade-sprints.html',
                color: 'blue'
            },
            {
                title: 'O Papel do Product Manager Técnico em Integrações Fintech',
                description: 'Do discovery à entrega de APIs financeiras críticas e conciliação PIX automatizada sem comprometer a estabilidade do ecossistema.',
                category: 'Engenharia & APIs',
                filters: ['tecnologia', 'produto'],
                date: '28 Set, 2026',
                dateValue: '2026-09-28',
                readingTime: '7 min de leitura',
                href: 'artigo-product-manager-fintech.html',
                color: 'indigo'
            },
            {
                title: 'Utilizando Lead Time e Cycle Time para Otimizar Capacidade de Produção',
                description: 'Como analisar métricas de fluxo de trabalho para identificar gargalos e garantir previsibilidade contínua de software.',
                category: 'Métricas & Ágil',
                filters: ['agil'],
                date: '10 Ago, 2026',
                dateValue: '2026-08-10',
                readingTime: '4 min de leitura',
                href: 'artigo-lead-time-cycle-time.html',
                color: 'emerald'
            }
        ];

        const pageSize = 6;
        const grid = document.getElementById('articles-grid');
        const pagination = document.getElementById('pagination');
        const summary = document.getElementById('results-summary');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('article-search');
        const categoryButtons = [...document.querySelectorAll('.category-filter')];
        const params = new URLSearchParams(window.location.search);
        let currentPage = Math.max(1, Number.parseInt(params.get('pagina') || '1', 10) || 1);
        let currentFilter = 'all';
        let currentSearch = '';

        function createArticleCard(article) {
            const categoryColors = {
                blue: 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300',
                indigo: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300',
                emerald: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
            };
            return `
                <article class="flex flex-col justify-between overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
                    <div class="space-y-3 p-6">
                        <div class="flex items-center justify-between gap-3 text-xs text-slate-500 dark:text-slate-400">
                            <span class="rounded px-2 py-0.5 font-semibold ${categoryColors[article.color] || categoryColors.blue}">${article.category}</span>
                            <span class="shrink-0">${article.readingTime}</span>
                        </div>
                        <h2 class="text-lg font-bold leading-snug"><a href="${article.href}" class="text-slate-900 transition-colors hover:text-blue-600 dark:text-white dark:hover:text-blue-400">${article.title}</a></h2>
                        <p class="text-xs leading-relaxed text-slate-600 dark:text-slate-400">${article.description}</p>
                    </div>
                    <div class="flex items-center justify-between border-t border-slate-100 bg-slate-50 px-6 py-4 dark:border-slate-800 dark:bg-slate-800/40">
                        <time datetime="${article.dateValue}" class="text-xs text-slate-400">${article.date}</time>
                        <a href="${article.href}" class="flex items-center gap-1 text-xs font-semibold text-blue-600 hover:underline dark:text-blue-400">Ler artigo <i class="fas fa-arrow-right text-[10px]"></i></a>
                    </div>
                </article>
            `;
        }

        function updateUrl() {
            const nextUrl = new URL(window.location.href);
            if (currentPage > 1) nextUrl.searchParams.set('pagina', currentPage);
            else nextUrl.searchParams.delete('pagina');
            history.replaceState(null, '', nextUrl);
        }

        function createPageButton(label, page, { active = false, disabled = false, ariaLabel = label } = {}) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            button.setAttribute('aria-label', ariaLabel);
            if (active) button.setAttribute('aria-current', 'page');
            button.disabled = disabled;
            button.className = active
                ? 'h-10 min-w-10 rounded-lg bg-blue-600 px-3 text-sm font-semibold text-white'
                : 'h-10 min-w-10 rounded-lg border border-slate-200 bg-white px-3 text-sm font-medium text-slate-700 transition hover:border-blue-500 hover:text-blue-600 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:text-blue-400';
            if (disabled) button.classList.add('cursor-not-allowed');
            button.addEventListener('click', () => {
                if (disabled || page === currentPage) return;
                currentPage = page;
                render();
                document.getElementById('page-title').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            return button;
        }

        function renderPagination(totalPages) {
            pagination.replaceChildren();
            const previous = createPageButton('‹', Math.max(1, currentPage - 1), { disabled: currentPage === 1, ariaLabel: 'Página anterior' });
            pagination.append(previous);
            for (let page = 1; page <= totalPages; page += 1) {
                pagination.append(createPageButton(String(page), page, { active: page === currentPage, ariaLabel: `Página ${page}` }));
            }
            const next = createPageButton('›', Math.min(totalPages, currentPage + 1), { disabled: currentPage === totalPages, ariaLabel: 'Próxima página' });
            pagination.append(next);
            const pageStatus = document.createElement('span');
            pageStatus.className = 'ml-2 text-xs text-slate-500 dark:text-slate-400';
            pageStatus.textContent = `Página ${currentPage} de ${totalPages}`;
            pagination.append(pageStatus);
        }

        function render() {
            const normalizedSearch = currentSearch.trim().toLocaleLowerCase('pt-BR');
            const filteredArticles = articles.filter(article => {
                const matchesCategory = currentFilter === 'all' || article.filters.includes(currentFilter);
                const searchableText = `${article.title} ${article.description} ${article.category}`.toLocaleLowerCase('pt-BR');
                return matchesCategory && searchableText.includes(normalizedSearch);
            });
            const totalPages = Math.max(1, Math.ceil(filteredArticles.length / pageSize));
            currentPage = Math.min(currentPage, totalPages);
            const startIndex = (currentPage - 1) * pageSize;
            const visibleArticles = filteredArticles.slice(startIndex, startIndex + pageSize);

            grid.innerHTML = visibleArticles.map(createArticleCard).join('');
            emptyState.classList.toggle('hidden', filteredArticles.length > 0);
            grid.classList.toggle('hidden', filteredArticles.length === 0);
            summary.textContent = filteredArticles.length
                ? `Exibindo ${startIndex + 1}–${Math.min(startIndex + pageSize, filteredArticles.length)} de ${filteredArticles.length} artigos`
                : '0 artigos encontrados';
            renderPagination(totalPages);
            updateUrl();
        }

        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                currentFilter = button.dataset.filter;
                currentPage = 1;
                categoryButtons.forEach(item => {
                    const selected = item === button;
                    item.setAttribute('aria-pressed', String(selected));
                    item.className = selected
                        ? 'category-filter rounded-lg bg-blue-600 px-3 py-2 text-xs font-semibold text-white transition'
                        : 'category-filter rounded-lg bg-slate-200 px-3 py-2 text-xs font-medium text-slate-700 transition hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700';
                });
                render();
            });
        });

        searchInput.addEventListener('input', () => {
            currentSearch = searchInput.value;
            currentPage = 1;
            render();
        });

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const savedTheme = localStorage.getItem('color-theme');
        const useDarkTheme = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', useDarkTheme);
        themeIcon.className = useDarkTheme ? 'fas fa-sun text-amber-400' : 'fas fa-moon text-slate-600';
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
            themeIcon.className = isDark ? 'fas fa-sun text-amber-400' : 'fas fa-moon text-slate-600';
        });

        render();
    </script>
</body>
</html>
